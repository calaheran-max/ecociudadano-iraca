<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auditoría docente · EcoCiudadano Iracá</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Sans:wght@400;600&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Libre+Baskerville:wght@700&family=Manrope:wght@400;700&family=Nunito:wght@400;700&family=Orbitron:wght@600&family=Outfit:wght@400;700&family=Playfair+Display:wght@700&family=Quicksand:wght@500;700&family=Rajdhani:wght@600&family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/themes.css" />
  </head>
  <body class="theme-diego">
    <div class="water-background" aria-hidden="true"><span></span><span></span><span></span></div>
    <header class="topbar">
      <div>
        <small>I.E. Iracá · Centro de mando</small>
        <strong>Auditoría docente</strong>
      </div>
      <a href="./index.html">Sitio del estudiante</a>
    </header>
    <div class="shell">
      <aside class="moon-stage" id="moon-stage" tabindex="0" role="listbox" aria-label="Campañas docentes. Usa flechas arriba y abajo, Enter para abrir">
        <div class="moon-disc" aria-hidden="true"></div>
        <span class="moon-pointer" aria-hidden="true"></span>
      </aside>
      <main id="workspace" class="workspace" aria-live="polite">
        <p class="workspace-empty">Elige la campaña bajo la flecha para ver solo sus resultados.</p>
      </main>
    </div>
    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
