<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoCiudadano Iracá · Grado 11°</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Sans:wght@400;600&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Libre+Baskerville:wght@700&family=Manrope:wght@400;700&family=Nunito:wght@400;700&family=Orbitron:wght@600&family=Outfit:wght@400;700&family=Playfair+Display:wght@700&family=Quicksand:wght@500;700&family=Rajdhani:wght@600&family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/themes.css" />
  </head>
  <body class="theme-diego intro-fase-0">
    <div class="water-background" aria-hidden="true"><span></span><span></span><span></span></div>

    <div id="intro-overlay" class="intro-overlay" role="dialog" aria-label="Presentación EcoCiudadano">
      <div class="intro-copy">
        <h1 id="intro-title" class="intro-title"></h1>
        <p id="intro-sub" class="intro-sub" hidden></p>
      </div>
      <button type="button" class="btn intro-skip" id="intro-skip">Saltar entrada</button>
    </div>

    <header class="topbar intro-ui">
      <div>
        <small>I.E. Iracá · San Martín, Meta · Guía 8</small>
        <strong>EcoCiudadano Iracá</strong>
      </div>
      <nav class="topbar-nav" aria-label="Accesos">
        <button type="button" class="topbar-btn" id="btn-qr" aria-haspopup="dialog" aria-controls="qr-modal">
          Código QR
        </button>
        <a href="./mascotas.html">Mascotas</a>
        <a class="topbar-btn topbar-btn-docente" href="./admin.html">Panel docente</a>
      </nav>
    </header>
    <div class="shell intro-ui">
      <aside class="moon-stage" id="moon-stage" tabindex="0" role="listbox" aria-label="Campañas. Usa flechas arriba y abajo, Enter para entrar">
        <div class="moon-disc" aria-hidden="true"></div>
        <span class="moon-pointer" aria-hidden="true"></span>
      </aside>
      <main id="workspace" class="workspace" aria-live="polite">
        <p class="workspace-empty">La campaña bajo la flecha aparecerá aquí.</p>
      </main>
    </div>

    <div class="qr-modal" id="qr-modal" hidden aria-hidden="true" role="dialog" aria-labelledby="qr-title">
      <div class="qr-modal-backdrop" id="qr-modal-backdrop"></div>
      <div class="qr-modal-panel">
        <button type="button" class="qr-modal-close" id="qr-modal-close" aria-label="Cerrar">×</button>
        <h2 id="qr-title">Acceso desde el celular</h2>
        <p class="qr-lead">Escanea el código con la cámara (misma Wi‑Fi que este PC). Sirve para PC y móvil.</p>
        <div class="qr-frame">
          <img id="qr-img" width="200" height="200" alt="Código QR de acceso" />
        </div>
        <p class="qr-url" id="qr-url">—</p>
        <p class="qr-hint" id="qr-hint"></p>
        <button type="button" class="btn" id="qr-copy">Copiar enlace</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
